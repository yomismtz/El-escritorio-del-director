name: Wire Director document library

on:
  push:
    paths:
      - '.github/workflows/patch-document-support.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add document library to More
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/profecuaderno/director/MainActivity.kt')
          s = p.read_text()
          marker = '        item { Text("Más", style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Bold) }\n'
          addition = marker + '        item { DirectorDocumentsCard() }\n'
          if 'DirectorDocumentsCard()' not in s:
              if marker not in s:
                  raise SystemExit('Marker not found')
              s = s.replace(marker, addition, 1)
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/profecuaderno/director/MainActivity.kt
          git commit -m "Show institutional document import in Director app" || exit 0
          git push
