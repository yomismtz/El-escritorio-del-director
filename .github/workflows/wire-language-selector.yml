name: Wire bilingual language selector

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wire-language-selector.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add runtime language selector
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/profecuaderno/director/MainActivity.kt')
          s = p.read_text()
          s = s.replace('''        setContent {\n            var theme by remember {''', '''        setContent {\n            val appLanguage = remember { AppLanguagePrefs.load(this@MainActivity) }\n            var theme by remember {''')
          old = '''            DirectorTheme(theme) {\n                DirectorApp(\n                    currentTheme = theme,\n                    onThemeChange = {\n                        theme = it\n                        prefs.edit().putString("theme", it.key).apply()\n                    }\n                )\n            }'''
          new = '''            CompositionLocalProvider(LocalAppLanguage provides appLanguage) {\n                DirectorTheme(theme) {\n                    DirectorApp(\n                        currentTheme = theme,\n                        onThemeChange = {\n                            theme = it\n                            prefs.edit().putString("theme", it.key).apply()\n                        }\n                    )\n                }\n            }'''
          if old not in s:
              raise SystemExit('Director theme block not found')
          s = s.replace(old, new)
          s = s.replace('''private fun MoreScreen(currentTheme: AgendaThemeStyle, onThemeChange: (AgendaThemeStyle) -> Unit) {\n    LazyColumn''', '''private fun MoreScreen(currentTheme: AgendaThemeStyle, onThemeChange: (AgendaThemeStyle) -> Unit) {\n    val context = androidx.compose.ui.platform.LocalContext.current\n    val language = LocalAppLanguage.current\n    LazyColumn''')
          marker = '''        item { Text("Más", style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Bold) }\n        item { DirectorDocumentsCard() }'''
          replacement = '''        item { Text(language.text("Más", "More"), style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Bold) }\n        item {\n            ElevatedCard(Modifier.fillMaxWidth()) {\n                Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {\n                    Text(language.text("Idioma", "Language"), fontWeight = FontWeight.Bold)\n                    Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {\n                        AppLanguage.entries.forEach { item ->\n                            FilterChip(\n                                selected = language == item,\n                                onClick = {\n                                    if (language != item) {\n                                        AppLanguagePrefs.save(context, item)\n                                        (context as? android.app.Activity)?.recreate()\n                                    }\n                                },\n                                label = { Text(item.label) },\n                                modifier = Modifier.weight(1f)\n                            )\n                        }\n                    }\n                }\n            }\n        }\n        item { DirectorDocumentsCard() }'''
          if marker not in s:
              raise SystemExit('More screen marker not found')
          s = s.replace(marker, replacement)
          # Translate navigation labels immediately.
          s = s.replace('Text("Inicio")', 'Text(language.text("Inicio", "Home"))')
          s = s.replace('Text("Docentes")', 'Text(language.text("Docentes", "Teachers"))')
          s = s.replace('Text("Horarios")', 'Text(language.text("Horarios", "Schedules"))')
          s = s.replace('Text("Avisos")', 'Text(language.text("Avisos", "Notices"))')
          # Add language in DirectorApp scope for nav labels.
          s = s.replace('''fun DirectorApp(currentTheme: AgendaThemeStyle, onThemeChange: (AgendaThemeStyle) -> Unit) {\n    var section''', '''fun DirectorApp(currentTheme: AgendaThemeStyle, onThemeChange: (AgendaThemeStyle) -> Unit) {\n    val language = LocalAppLanguage.current\n    var section''')
          p.write_text(s)
          PY
      - name: Commit source change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/profecuaderno/director/MainActivity.kt
          git diff --cached --quiet || git commit -m "Add Spanish English selector to Director app"
          git push
